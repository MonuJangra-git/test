version: "3.8"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "3000:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - webnet
    restart: unless-stopped

volumes:
  jenkins_home:

networks:
  webnet:
    driver: bridge
